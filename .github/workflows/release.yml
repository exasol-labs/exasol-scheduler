name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build release (${{ matrix.artifact_name }})
    needs: clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_format: tar.gz
            binary_name: exasol_scheduler
          - artifact_name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_format: tar.gz
            binary_name: exasol_scheduler
          - artifact_name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive_format: tar.gz
            binary_name: exasol_scheduler
          - artifact_name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            archive_format: tar.gz
            binary_name: exasol_scheduler
          - artifact_name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            binary_name: exasol_scheduler.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          ref_name="${GITHUB_REF_NAME//\//-}"
          name="exasol_scheduler-${ref_name}-${{ matrix.artifact_name }}"
          binary="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"

          if [[ "${{ matrix.archive_format }}" == "zip" ]]; then
            archive="dist/${name}.zip"
            7z a "$archive" \
              "$binary" \
              README.md LICENSE docs
          else
            archive="dist/${name}.tar.gz"
            tar -czf "$archive" \
              "$binary" \
              README.md LICENSE docs
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
