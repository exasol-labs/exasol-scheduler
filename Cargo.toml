[package]
name = "exasol_scheduler"
version = "0.1.0"
edition = "2024"

[dependencies]
# exarrow-rs provides production Exasol access.
exarrow = { package = "exarrow-rs", version = "0.12.2" }
# Tokio: follow exarrow-rs guidance (rt-multi-thread + macros) while keeping features minimal.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
cron = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "57.3.0"

[dev-dependencies]
mockall = "0.12"
pretty_assertions = "1"
